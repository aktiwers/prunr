name: Release

on:
  push:
    tags: ["v*"]
  # Manual trigger so we can iterate on CI changes (dylib bundling,
  # etc.) without tagging an actual release. The job still produces
  # artifacts but skips the GitHub-release step.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: prunr
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: prunr
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: prunr.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev icnsutils rpm

      # The runner's glibc would set the binary's floor (2.35 on Ubuntu
      # 24.04: no Debian 11, Ubuntu 20.04 or RHEL 8/9). zig links against
      # glibc 2.28, the floor of the ONNX Runtime wheel shipped beside it.
      - name: Install zig + cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Restore model cache
        id: cache-models
        uses: actions/cache@v4
        with:
          # Cache only the bundled .zst files — the raw .onnx are
          # ~2× larger and never read at build time. Halves cache
          # upload/restore time and keeps us further from the 10 GB
          # eviction threshold.
          path: models/*.zst
          # Hash the model manifest (xtask/src/models.rs) and the
          # registry — these are the only inputs whose change should
          # bust the cache. Hashing the whole `xtask/src/main.rs` like
          # we used to threw away the cache on every unrelated edit
          # (CLI parsing, install-runtime fixes), forcing a 700 MB
          # re-fetch each CI run.
          key: models-v3-${{ hashFiles('xtask/src/models.rs', 'crates/prunr-models/src/lib.rs') }}

      - name: Fetch models (cache miss)
        if: steps.cache-models.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: cargo xtask fetch-models

      - name: Compress models to .zst (if needed)
        shell: bash
        run: |
          for f in models/*.onnx; do
            if [ -f "$f" ] && [ ! -f "$f.zst" ]; then
              echo "Compressing $f ..."
              zstd -19 "$f" -o "$f.zst"
            fi
          done

      # Patch version from git tag into Info.plist before building.
      # Skipped on workflow_dispatch (no tag → keep the in-repo placeholder).
      # Two targeted seds (one per key) so unrelated version-shaped strings
      # elsewhere in the file are never touched.
      - name: Patch macOS Info.plist version
        if: matrix.name == 'macos-aarch64' && github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "/<key>CFBundleVersion<\/key>/,/<\/string>/ s|<string>[0-9.]*</string>|<string>${VERSION}</string>|" assets/Info.plist
          sed -i '' "/<key>CFBundleShortVersionString<\/key>/,/<\/string>/ s|<string>[0-9.]*</string>|<string>${VERSION}</string>|" assets/Info.plist

      # The ONNX Runtime the macOS artifacts ship needs macOS 14
      # (its LC_BUILD_VERSION minos), the floor Info.plist declares; the
      # binary is built for the same floor.
      - name: Set macOS deployment target
        if: matrix.name == 'macos-aarch64'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' assets/Info.plist)" >> "$GITHUB_ENV"

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p prunr-app

      - name: Build release binary (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.28 -p prunr-app

      - name: Check the glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          # Weak symbols (std's pidfd_spawnp) are looked up at run time.
          FLOOR=$(objdump -T target/${{ matrix.target }}/release/${{ matrix.binary }} | awk '$2 != "w"' | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc floor: $FLOOR"
          if [ "$(printf '%s\nGLIBC_2.28\n' "$FLOOR" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::the binary needs $FLOOR, above glibc 2.28"
            exit 1
          fi

      # ── ONNX Runtime (Linux, macOS) ──
      # `ort` is built with `load-dynamic`: the binary loads
      # libonnxruntime at run time from beside itself. CI stages
      # Microsoft's PyPI wheel through the same xtask the GUI uses for
      # the runtime store, one source of truth for the install layout;
      # xtask fails if the wheel holds no runtime. The Linux wheel is
      # CPU-only (GPU users upgrade through Settings → Hardware); the
      # macOS arm64 wheel carries CoreML.
      # Cached so each release run doesn't re-fetch the wheel. Keyed on
      # the install logic (the PINNED_ORT_VERSION constant + wheel
      # picker), so a version bump or repackager change busts it.
      - name: Cache runtime-stage (Linux, macOS)
        id: cache-runtime-unix
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: runtime-stage
          key: runtime-stage-${{ matrix.name }}-${{ hashFiles('crates/prunr-runtime-install/src/lib.rs') }}

      - name: Stage runtime (Linux, macOS)
        if: runner.os != 'Windows' && steps.cache-runtime-unix.outputs.cache-hit != 'true'
        run: cargo xtask install-runtime onnxruntime 1.24.1 --stage-to runtime-stage

      # ── Linux: .tar.gz + .AppImage + .deb + .rpm ──
      - name: Package Linux tar.gz
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p dist/runtime
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp runtime-stage/libonnxruntime.so dist/runtime/
          cd dist && tar czf ../prunr-linux-x86_64.tar.gz ${{ matrix.binary }} runtime/

      - name: Package Linux AppImage
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p AppDir/usr/bin/runtime AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} AppDir/usr/bin/
          cp runtime-stage/libonnxruntime.so AppDir/usr/bin/runtime/
          cp assets/prunr-256.png AppDir/usr/share/icons/hicolor/256x256/apps/prunr.png
          cp assets/prunr-256.png AppDir/prunr.png
          cp assets/prunr.desktop AppDir/
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir/ Prunr-x86_64.AppImage

      - name: Package Linux .deb
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p deb/usr/bin/runtime deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps deb/DEBIAN
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} deb/usr/bin/
          cp runtime-stage/libonnxruntime.so deb/usr/bin/runtime/
          cp assets/prunr.desktop deb/usr/share/applications/
          cp assets/prunr-256.png deb/usr/share/icons/hicolor/256x256/apps/prunr.png
          # Tag pushes carry the version in the ref (v0.4.8 → 0.4.8).
          # workflow_dispatch runs from a branch — fall back to Cargo.toml
          # so the .deb / .rpm version always satisfies dpkg/rpm's
          # "must start with a digit" rule.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)
          fi
          SIZE=$(du -s deb/usr | cut -f1)
          cat > deb/DEBIAN/control << CTRL
          Package: prunr
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Prunr <prunr@example.com>
          Depends: libc6 (>= 2.28), libgtk-3-0, libxkbcommon0, libfontconfig1
          Section: graphics
          Priority: optional
          Installed-Size: ${SIZE}
          Description: Local AI background removal
           Remove backgrounds from images using ONNX neural networks.
           Ships with embedded models - no cloud, no API keys.
          CTRL
          # Remove leading spaces from heredoc
          sed -i 's/^          //' deb/DEBIAN/control
          dpkg-deb --build deb prunr-linux-x86_64.deb

      - name: Package Linux .rpm
        if: matrix.name == 'linux-x86_64'
        run: |
          # Same version-from-tag-or-Cargo.toml pattern as .deb above.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)
          fi
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} rpmbuild/SOURCES/
          cp runtime-stage/libonnxruntime.so rpmbuild/SOURCES/
          cp assets/prunr.desktop rpmbuild/SOURCES/
          cp assets/prunr-256.png rpmbuild/SOURCES/
          cat > rpmbuild/SPECS/prunr.spec << 'SPEC'
          Name:           prunr
          Version:        VERSION_PLACEHOLDER
          Release:        1%{?dist}
          Summary:        Local AI background removal
          License:        Apache-2.0
          URL:            https://github.com/aktiwers/prunr

          %description
          Remove backgrounds from images using ONNX neural networks.
          Ships with embedded models — no cloud, no API keys.

          %install
          install -Dm755 %{_sourcedir}/prunr %{buildroot}%{_bindir}/prunr
          install -Dm755 %{_sourcedir}/libonnxruntime.so %{buildroot}%{_bindir}/runtime/libonnxruntime.so
          install -Dm644 %{_sourcedir}/prunr.desktop %{buildroot}%{_datadir}/applications/prunr.desktop
          install -Dm644 %{_sourcedir}/prunr-256.png %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/prunr.png

          %files
          %{_bindir}/prunr
          %{_bindir}/runtime/libonnxruntime.so
          %{_datadir}/applications/prunr.desktop
          %{_datadir}/icons/hicolor/256x256/apps/prunr.png
          SPEC
          sed -i 's/^          //' rpmbuild/SPECS/prunr.spec
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" rpmbuild/SPECS/prunr.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/prunr.spec
          cp rpmbuild/RPMS/x86_64/*.rpm prunr-linux-x86_64.rpm || true

      - name: Upload Linux artifacts
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: prunr-linux-x86_64
          path: |
            prunr-linux-x86_64.tar.gz
            Prunr-x86_64.AppImage
            prunr-linux-x86_64.deb
            prunr-linux-x86_64.rpm

      # ── macOS: .tar.gz + .dmg ──
      - name: Generate .icns
        if: matrix.name == 'macos-aarch64'
        run: |
          mkdir -p prunr.iconset
          sips -z 256 256 assets/prunr-256.png --out prunr.iconset/icon_256x256.png
          sips -z 128 128 assets/prunr-256.png --out prunr.iconset/icon_128x128.png
          sips -z 64 64 assets/prunr-256.png --out prunr.iconset/icon_64x64.png
          sips -z 32 32 assets/prunr-256.png --out prunr.iconset/icon_32x32.png
          sips -z 16 16 assets/prunr-256.png --out prunr.iconset/icon_16x16.png
          iconutil -c icns prunr.iconset -o assets/prunr.icns

      - name: Package macOS .app + .dmg
        if: matrix.name == 'macos-aarch64'
        run: |
          mkdir -p Prunr.app/Contents/{MacOS,Frameworks,Resources}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} Prunr.app/Contents/MacOS/
          cp runtime-stage/libonnxruntime.dylib Prunr.app/Contents/Frameworks/
          cp assets/Info.plist Prunr.app/Contents/
          cp assets/prunr.icns Prunr.app/Contents/Resources/
          # Ad-hoc sign so Gatekeeper doesn't immediately block (signs the
          # bundled dylib as well via --deep)
          codesign --force --deep --sign - Prunr.app
          # Create DMG
          brew install create-dmg
          create-dmg \
            --volname "Prunr" \
            --window-size 600 400 \
            --icon "Prunr.app" 175 200 \
            --app-drop-link 425 200 \
            --no-internet-enable \
            "Prunr-macos-aarch64.dmg" \
            "Prunr.app"

      - name: Package macOS tar.gz
        if: matrix.name == 'macos-aarch64'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp runtime-stage/libonnxruntime.dylib dist/
          cd dist && tar czf ../prunr-macos-aarch64.tar.gz *

      - name: Upload macOS artifacts
        if: matrix.name == 'macos-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: prunr-macos-aarch64
          path: |
            Prunr-macos-aarch64.dmg
            prunr-macos-aarch64.tar.gz

      # ── Windows: .zip + .exe installer ──
      # Same load-dynamic story as Linux, but the staged runtime is the
      # DirectML build (`onnxruntime-directml`): it runs the models on any
      # DirectX 12 GPU and on the CPU without one. Its onnxruntime.dll
      # delay-loads DirectML.dll from its own folder, so both go to
      # <exe>/runtime/, where `bundled_dylib` finds the first and
      # `ort_runtime::init` preloads the second.
      - name: Cache runtime-stage (Windows)
        id: cache-runtime-windows
        if: matrix.name == 'windows-x86_64'
        uses: actions/cache@v4
        with:
          path: runtime-stage
          key: runtime-stage-windows-directml-${{ hashFiles('crates/prunr-runtime-install/src/lib.rs') }}

      - name: Stage DirectML runtime (Windows)
        if: matrix.name == 'windows-x86_64' && steps.cache-runtime-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo xtask install-runtime onnxruntime-directml 1.24.1 --stage-to runtime-stage
          foreach ($dll in "onnxruntime.dll", "DirectML.dll") {
            if (-not (Test-Path "runtime-stage/$dll")) {
              Write-Error "::error::$dll not found in runtime-stage/ — xtask layout drift"
              Get-ChildItem runtime-stage/
              exit 1
            }
          }

      # The staged runtime must load under our ort version, carry
      # DirectML and run a model. The session runs on the CPU (the runner
      # has no GPU), so DirectML.dll itself is never loaded here.
      - name: Smoke-test the shipped runtime (Windows)
        if: matrix.name == 'windows-x86_64'
        timeout-minutes: 15
        run: cargo xtask probe-load-dynamic runtime-stage/onnxruntime.dll --require-ep DmlExecutionProvider

      - name: Package Windows zip
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/runtime
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item "runtime-stage/onnxruntime.dll" dist/runtime/
          Copy-Item "runtime-stage/DirectML.dll" dist/runtime/
          Compress-Archive -Path "dist/*" -DestinationPath "prunr-windows-x86_64.zip"

      - name: Package Windows installer (Inno Setup)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          # On tag pushes (`refs/tags/vX.Y.Z`) the version comes from the
          # tag name; on `workflow_dispatch` from a branch the ref isn't
          # version-shaped, so fall back to Cargo.toml — same pattern as
          # the Linux .deb / .rpm steps. Without this fallback the
          # installer ships with `AppVersion=master`, which Inno Setup
          # accepts but produces unusable Windows installer metadata.
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line -replace '.*"(.+)".*', '$1'
          }
          @"
          [Setup]
          AppName=Prunr
          AppVersion=$version
          DefaultDirName={autopf}\Prunr
          DefaultGroupName=Prunr
          OutputDir=.
          OutputBaseFilename=prunr-windows-x86_64-setup
          Compression=lzma2
          SolidCompression=yes
          SetupIconFile=assets\prunr.ico
          UninstallDisplayIcon={app}\prunr.exe

          [Files]
          Source: "target\${{ matrix.target }}\release\${{ matrix.binary }}"; DestDir: "{app}"; Flags: ignoreversion
          Source: "runtime-stage\onnxruntime.dll"; DestDir: "{app}\runtime"; Flags: ignoreversion
          Source: "runtime-stage\DirectML.dll"; DestDir: "{app}\runtime"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Prunr"; Filename: "{app}\prunr.exe"; IconFilename: "{app}\prunr.exe"
          Name: "{commondesktop}\Prunr"; Filename: "{app}\prunr.exe"; IconFilename: "{app}\prunr.exe"
          "@ | Out-File -Encoding UTF8 setup.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Windows artifacts
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: prunr-windows-x86_64
          path: |
            prunr-windows-x86_64.zip
            prunr-windows-x86_64-setup.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only publish on tag pushes. workflow_dispatch test runs build the
    # artifacts (proves the matrix works) but skip the GH Release step,
    # which would otherwise fail with "GitHub Releases requires a tag".
    if: github.ref_type == 'tag'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
