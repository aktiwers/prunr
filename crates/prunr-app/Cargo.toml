[package]
name = "prunr-app"
version.workspace = true
edition.workspace = true
repository = "https://github.com/aktiwers/prunr"

[[bin]]
name = "prunr"
path = "src/main.rs"

[lib]
name = "prunr_app"
path = "src/lib.rs"

[features]
# Enable runtime model loading from filesystem (for development without embedding ONNX files).
# Usage: cargo check -p prunr-app --features dev-models
dev-models = ["prunr-core/dev-models"]
# Expose test-only constructors (e.g. BatchItem::new_for_test) for integration
# tests in sibling crates that can't use #[cfg(test)] across crate boundaries.
test-utils = []

[dependencies]
prunr-core = { path = "../prunr-core" }
prunr-models = { path = "../prunr-models" }
prunr-runtime-install = { path = "../prunr-runtime-install" }
ort = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
arboard = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
egui-notify = { workspace = true }
egui_material_icons = { workspace = true }
accesskit = { workspace = true }
accesskit_consumer = { workspace = true }
dirs = { workspace = true }
zstd = { workspace = true }
bytemuck = { workspace = true }
sysinfo = { workspace = true }
bincode = { workspace = true }
memory-stats = { workspace = true }
ndarray = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
prunr-core = { path = "../prunr-core", features = ["test-utils"] }
proptest = { workspace = true }
tempfile = { workspace = true }
egui_kittest = { workspace = true }
zip = { workspace = true }

# OS drag-out: supported on Windows and macOS. On Linux the crate requires a
# GTK window (winit/eframe cannot supply one), and pulls in gtk/gdk native
# deps, so we exclude it entirely on Linux and show a fallback toast instead.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"

# Whether another instance's process still runs (its folders are kept).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Quit answers AppKit itself, so unsaved work is asked about first. The
# versions eframe already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }

# Windows: attach to parent console when run from cmd/PowerShell so CLI output
# reaches the user. Paired with `#![windows_subsystem = "windows"]` in main.rs
# to suppress the empty console window on GUI launch.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation"] }
# GPU detection: DXGI lists the display adapters without creating a
# device. The same version and features the GPU stack already builds.
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[build-dependencies]
winresource = "0.1"
