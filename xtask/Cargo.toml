[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zstd = { workspace = true }
# `dev-models` keeps `include_bytes!` out so xtask can compile before the
# .zst files exist (xtask is the tool that produces them).
prunr-models = { path = "../crates/prunr-models", features = ["dev-models"] }
prunr-runtime-install = { path = "../crates/prunr-runtime-install" }

# Used by the load-dynamic probe task.
ort = { workspace = true }
ndarray = { workspace = true }
# Extract OpenVINO ORT bundles from PyPI .whl files (zip archives).

# Read/write PNGs for the `render-golden-diff` subcommand.
image = { workspace = true }
